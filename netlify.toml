[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Supabase Edge Functions proxy (for development/testing)
[[redirects]]
  from = "/api/functions/*"
  to = "https://your-project.supabase.co/functions/v1/:splat"
  status = 200
  force = true

# Handle Stripe webhooks
[[redirects]]
  from = "/api/stripe/webhook"
  to = "https://your-project.supabase.co/functions/v1/stripe-webhook"
  status = 200
  force = true