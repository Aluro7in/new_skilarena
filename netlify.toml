[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Handle media access for AI features
[[headers]]
  for = "/index.html"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"

# Specific redirect for Stripe webhook requests
[[redirects]]
  from = "/api/stripe-webhook"
  to = "https://qzeodctbfxtnexaguggg.supabase.co/functions/v1/stripe-webhook"
  status = 200
  force = true

